<!DOCTYPE html>
<html>
<head>
  <title>eCW Local AI</title>
  <style>
    body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; color: #333; }
    h2 { margin-top: 0; color: #0056b3; font-size: 18px; }
    .btn { display: block; width: 100%; padding: 10px; margin-bottom: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn:hover { background-color: #004494; }
    #status { margin-top: 15px; font-size: 12px; color: #666; white-space: pre-wrap; word-wrap: break-word; background: #f4f4f4; padding: 8px; border-radius: 4px; display: none; }
    .input-group { margin-bottom: 10px; }
    .input-group input { width: 100%; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h2>eCW Local AI Assistant</h2>
  <button id="btn-summary" class="btn">Generate Patient Summary</button>
  
  <div class="input-group">
    <input type="text" id="target-req" placeholder="e.g., MRI Left Knee">
  </div>
  <button id="btn-prior-auth" class="btn">Generate Prior Auth</button>

  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
